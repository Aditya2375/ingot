name: test
on: [push, pull_request]
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: make build/test-unit
      - run: ./build/test-unit
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: make && sh tests/run-tests.sh && sh tests/check-docs.sh
  sanitize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: make sanitize
      - name: prove the sanitized binary really carries ASan
        run: nm build/test-unit | grep -q __asan_init || { echo "sanitized build/test-unit has no ASan symbols"; exit 1; }
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: make build/test-fuzz
      - name: mutated + random blobs (several seeds)
        run: |
          for seed in 1 2 3 4 5 20261103; do
            python3 tests/fuzz.py --blobs 25 --seed "$seed"
          done
      - name: fuzz under sanitizers
        run: |
          make clean
          make EXTRA="-fsanitize=address,undefined,float-cast-overflow -fno-sanitize-recover=all -fno-omit-frame-pointer" build/test-fuzz
          # guard: prove the binary really carries ASan before trusting the step
          nm build/test-fuzz | grep -q __asan_init || { echo "sanitized build/test-fuzz has no ASan symbols"; exit 1; }
          ASAN_OPTIONS=detect_leaks=0 UBSAN_OPTIONS=halt_on_error=1 python3 tests/fuzz.py --blobs 60
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: mymindstorm/setup-emsdk@6ab9eb1bda2574c4ddb79809fc9247783eaf9021   # v14
        with:
          version: 6.0.13
      - name: rebuild the demo strictly from source
        # deleting docs/ first proves the workflow never leans on the
        # committed artifact: the build must regenerate it wholesale
        run: |
          rm -rf docs/
          git checkout -- docs/index.html docs/app.js docs/404.html docs/robots.txt docs/sitemap.xml docs/llms.txt docs/ingot.wasm
          sh wasm/build.sh
      - run: node tests/wasm-smoke.js
      - name: preserve rebuilt binary for reproducibility diagnosis
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ingot-rebuilt-wasm
          path: docs/3-ingot-v2.wasm
          retention-days: 1
      - name: committed demo matches a fresh build
        run: git diff --exit-code --stat docs/
